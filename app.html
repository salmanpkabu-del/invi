<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebrati — Ultra-Premium Event Invitation & Management Platform</title>
  
  <meta name="description" content="Design ultra-luxurious story-based digital invitations, track RSVPs, meal preferences, and issue digital QR entry passes for weddings, galas, and VIP celebrations.">
  <meta property="og:title" content="Celebrati — Ultra-Premium Event Invitations">
  <meta property="og:description" content="Design ultra-luxurious story-based digital invitations, track RSVPs in real time, and issue digital QR entry passes.">
  <meta property="og:image" content="skylightlogo.svg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>">
  
  <!-- Google Fonts — Premium Typography Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Alex+Brush&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Italiana&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css?v=6.0">
  <link rel="stylesheet" href="styles/themes.css?v=6.0">
  <link rel="stylesheet" href="styles/admin.css?v=6.0">
  <link rel="stylesheet" href="styles/invitation.css?v=6.0">
  <link rel="stylesheet" href="styles/auth.css?v=6.0">
  <link rel="stylesheet" href="styles/tracker.css?v=6.0">
  <!-- Three.js 3D WebGL Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Top Persona View Switcher Bar -->
  <header id="view-switcher-bar">
    <a href="index.html" class="brand-logo" style="text-decoration: none; color: inherit;" title="Go to Celebrati Landing Page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span>CELEBRATI</span>
    </a>

    <!-- View Switcher Pills -->
    <div class="view-pills">
      <a href="index.html" class="view-pill" style="text-decoration: none;">
        <span>🏠 Home Landing</span>
      </a>
      <button class="view-pill active" data-view="invite">
        <span>💌 Public Invite View</span>
      </button>
      <button class="view-pill" data-view="dashboard">
        <span>📊 Host Dashboard</span>
      </button>
      <button class="view-pill" data-view="admin">
        <span>⚙️ Admin Creator Studio</span>
      </button>
    </div>

    <!-- Quick Controls -->
    <div class="view-switcher-right">
      <select id="event-quick-select" class="event-quick-select" title="Active Event">
        <!-- Populated dynamically via storage JS -->
      </select>
      <button id="theme-toggle-btn" class="btn btn-secondary btn-sm" title="Toggle Dashboard Light/Dark Theme">
        🌙 Dark
      </button>
      <button id="logout-btn" class="btn btn-sm" title="Logout" style="background:rgba(239,68,68,0.15);color:#F87171;border:1px solid rgba(239,68,68,0.3);">
        🔒 Logout
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-container">
    <!-- Dynamic Component Views render here (Admin | Dashboard | Invite | Tracker) -->
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main Application Script (ES6 Modules) -->
  <script type="module" src="js/app.js?v=6.0"></script>
</body>
</html>
