<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebrati — Ultra-Premium Event Invitation & Management Platform</title>
  
  <meta name="description" content="Design ultra-luxurious story-based digital invitations, track RSVPs, meal preferences, and issue digital QR entry passes for weddings, galas, and VIP celebrations.">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/invitation.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/tracker.css">
</head>
<body>

  <!-- Top Persona View Switcher Bar -->
  <header id="view-switcher-bar">
    <div class="brand-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span>CELEBRATI</span>
    </div>

    <!-- View Switcher Pills -->
    <div class="view-pills">
      <button class="view-pill active" data-view="invite">
        <span>💌 Public Invite View</span>
      </button>
      <button class="view-pill" data-view="dashboard">
        <span>📊 Host Dashboard</span>
      </button>
      <button class="view-pill" data-view="admin">
        <span>⚙️ Admin Creator Studio</span>
      </button>
    </div>

    <!-- Quick Controls -->
    <div class="view-switcher-right">
      <select id="event-quick-select" class="event-quick-select" title="Active Event">
        <!-- Populated dynamically via storage JS -->
      </select>
      <button id="theme-toggle-btn" class="btn btn-secondary btn-sm" title="Toggle Dashboard Light/Dark Theme">
        🌙 Dark
      </button>
      <button id="logout-btn" class="btn btn-sm" title="Logout" style="background:rgba(239,68,68,0.15);color:#F87171;border:1px solid rgba(239,68,68,0.3);">
        🔒 Logout
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-container">
    <!-- Dynamic Component Views render here (Admin | Dashboard | Invite | Tracker) -->
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main Application Script (ES6 Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
